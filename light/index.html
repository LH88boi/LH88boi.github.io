    <button class="pencil" id="enterBtn" aria-label="进入光影">
      <span class="pencil-label mono">翻开桌面</span>
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M11 37 L9 43 L15 41 L39 17 L31 9 Z" fill="#F8F2EB" stroke="#1F1B18" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M31 9 L36 4 L44 12 L39 17 Z" fill="#E8590C" stroke="#1F1B18" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M9 43 L15 41" stroke="#1F1B18" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M27 13 L35 21" stroke="#8A7F75" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
  </section>

  <!-- 正式页 -->
  <section class="studio hidden" id="studio">
    <header class="studio-head">
      <h2>光影</h2>
      <div class="tabs" role="tablist" aria-label="模块">
        <button class="tab" role="tab" aria-selected="true" data-kind="all">全部</button>
        <button class="tab" role="tab" aria-selected="false" data-kind="book">阅读</button>
        <button class="tab" role="tab" aria-selected="false" data-kind="movie">电影</button>
        <button class="tab" role="tab" aria-selected="false" data-kind="photo">旅途</button>
      </div>
      <div class="tools">
        <input class="search" id="search" type="search" placeholder="找点什么…" aria-label="搜索">
        <button class="tool" id="tidyBtn">整理桌面</button>
        <button class="tool" id="resetBtn">恢复默认</button>
        <button class="tool" id="backBtn">收起</button>
      </div>
    </header>
    <div class="desk-wrap" id="deskWrap"><div class="desk" id="desk"></div></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"><span class="dot"></span><span id="toastText"></span></div>
</div>

<script>
(function () {
  var app = document.getElementById('lightApp');
  if (!app || app.dataset.bound) return;
  app.dataset.bound = '1';

  var desk = document.getElementById('desk');
  var wrap = document.getElementById('deskWrap');
  var toast = document.getElementById('toast');
  var toastText = document.getElementById('toastText');
  var STORE = 'light-desk-v1';

  var DATA = [
    { id:'b1', kind:'book', tag:'阅读', title:'置身事内', sub:'兰小欢 · 72%', cover:'cover-a', x:40, y:36, rot:-2,
      desc:'地方财政与政府行为的一本入门书。读到第三章，开始理解很多新闻背后的账本。', quote:'“理解现实，先要理解账本。”', pin:false },
    { id:'b2', kind:'book', tag:'阅读', title:'小王子', sub:'圣埃克苏佩里 · 100%', cover:'cover-c', x:222, y:56, rot:1.5,
      desc:'重读了一遍，还是在同一种地方停下来。', quote:'“重要的东西，用眼睛是看不见的。”', pin:true },
    { id:'b3', kind:'book', tag:'阅读', title:'人类简史', sub:'赫拉利 · 35%', cover:'cover-b', x:404, y:38, rot:-1,
      desc:'从认知革命讲到科学革命，视野很大，读到一半有点吃力。', quote:'“虚构故事让我们大规模灵活地合作。”', pin:false },
    { id:'m1', kind:'movie', tag:'电影', title:'完美的日子', sub:'2023 · 8.7', cover:'cover-d', x:618, y:44, rot:2,
      desc:'一个把日常过得很认真的人。看完之后想去把家里的书架擦一遍。', quote:'“下一次还会有下一次的相遇。”', pin:true },
    { id:'m2', kind:'movie', tag:'电影', title:'花样年华', sub:'2000 · 9.4', cover:'cover-f', x:806, y:58, rot:-1.5,
      desc:'颜色、节拍和没说出口的话，都刚刚好。', quote:'“如果有多一张船票，你会不会跟我走。”', pin:false },
    { id:'m3', kind:'movie', tag:'电影', title:'海街日记', sub:'2015 · 8.8', cover:'cover-e', x:1000, y:40, rot:1,
      desc:'四姐妹、梅子酒、海边烟花。适合夏末的晚上重看。', quote:'“活着真好，如果不那么痛苦的话。”', pin:false },
    { id:'p1', kind:'photo', tag:'旅途', title:'海边的风', sub:'青岛 · 2025', cover:'cover-e', x:96, y:326, rot:1.5,
      desc:'傍晚的栈桥，风很大，云被吹成一条一条的。', quote:'那天的海是灰蓝色的。', pin:false },
    { id:'p2', kind:'photo', tag:'旅途', title:'山间雾', sub:'莫干山 · 2024', cover:'cover-b', x:348, y:342, rot:-2,
      desc:'早起推开窗，雾在竹林里慢慢走。', quote:'安静得能听见水珠落下来。', pin:false },
    { id:'p3', kind:'photo', tag:'旅途', title:'巷口的光', sub:'京都 · 2024', cover:'cover-h', x:598, y:330, rot:2,
      desc:'下午四点，光刚好斜着落在巷子的墙上。', quote:'手里那杯抹茶早就凉了。', pin:false },
    { id:'p4', kind:'photo', tag:'旅途', title:'雪后的路', sub:'哈尔滨 · 2023', cover:'cover-g', x:850, y:344, rot:-1,
      desc:'雪停之后的清晨，路上只有一串脚印。', quote:'冷得clear，也干净得clear。', pin:false }
  ];

  var byId = {};
  DATA.forEach(function (d) { byId[d.id] = d; });

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE) || '{}');
      if (s && s.items) {
        Object.keys(s.items).forEach(function (k) {
          if (!byId[k]) return;
          var v = s.items[k];
          if (typeof v.x === 'number') byId[k].x = v.x;
          if (typeof v.y === 'number') byId[k].y = v.y;
          if (typeof v.rot === 'number') byId[k].rot = v.rot;
          if (typeof v.pin === 'boolean') byId[k].pin = v.pin;
        });
      }
    } catch (e) {}
  }
  function save() {
    var items = {};
    DATA.forEach(function (d) { items[d.id] = { x:d.x, y:d.y, rot:d.rot, pin:d.pin }; });
    try { localStorage.setItem(STORE, JSON.stringify({ v:1, items:items })); } catch (e) {}
  }
  var toastTimer;
  function say(text) {
    toastText.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  function sizeOf(d) {
    if (d.kind === 'photo') return [208, 156];
    return [150, 222];
  }
  function cardHTML(d) {
    var w = sizeOf(d)[0], h = sizeOf(d)[1];
    var cls = d.kind === 'photo' ? 'pc-photo' : (d.kind === 'book' ? 'pc-book' : 'pc-movie');
    var cover = '<div class="face paper-card ' + cls + ' ' + d.cover + '" style="position:relative;left:auto;top:auto;transform:none">' +
      '<div class="pc-cover"></div><div class="tag mono">' + d.tag + '</div>' +
      '<div class="pc-title">' + d.title + '<small>' + d.sub + '</small></div></div>';
    return '<div class="card' + (d.pin ? ' pinned' : '') + '" data-id="' + d.id + '" data-kind="' + d.kind + '" tabindex="0" role="button" ' +
      'aria-label="' + d.title + '，查看详情" style="width:' + w + 'px;height:' + h + 'px;--x:' + d.x + 'px;--y:' + d.y + 'px;--rot:' + d.rot + 'deg">' +
      cover + '<button class="pin" title="钉住 / 取消钉住" aria-label="钉住">' + (d.pin ? '★' : '☆') + '</button></div>';
  }
  function paint() {
    desk.innerHTML = DATA.map(cardHTML).join('');
    applyFilter();
  }
  function position(d) {
    var el = desk.querySelector('[data-id="' + d.id + '"]');
    if (el) {
      el.style.setProperty('--x', d.x + 'px');
      el.style.setProperty('--y', d.y + 'px');
      el.style.setProperty('--rot', d.rot + 'deg');
    }
  }

  var current = 'all', query = '';
  function applyFilter() {
    var shown = 0;
    DATA.forEach(function (d) {
      var el = desk.querySelector('[data-id="' + d.id + '"]');
      if (!el) return;
      var okKind = current === 'all' || d.kind === current;
      var q = query.trim().toLowerCase();
      var okQuery = !q || (d.title + ' ' + d.sub + ' ' + d.desc).toLowerCase().indexOf(q) >= 0;
      var ok = okKind && okQuery;
      el.classList.toggle('filtered', !ok);
      if (ok) shown++;
    });
    var old = desk.querySelector('.empty');
    if (old) old.remove();
    if (!shown) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '这里还没有内容。<br>换个筛选，或者清除搜索试试。';
      desk.appendChild(e);
    }
  }

  function openModal(d) {
    var back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">' +
      '<button class="close" aria-label="关闭">×</button>' +
      '<h3 id="mTitle">' + d.title + '</h3>' +
      '<div class="subline mono">' + d.tag + ' · ' + d.sub + '</div>' +
      '<p>' + d.desc + '</p><p class="quote">' + d.quote + '</p></div>';
    document.body.appendChild(back);
    var close = back.querySelector('.close');
    close.focus();
    function shut() {
      back.remove();
      var el = desk.querySelector('[data-id="' + d.id + '"]');
      if (el) el.focus();
      document.removeEventListener('keydown', key);
    }
    function key(e) {
      if (e.key === 'Escape') { shut(); return; }
      if (e.key === 'Tab') {
        var f = back.querySelectorAll('button');
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    }
    back.addEventListener('click', function (e) { if (e.target === back || e.target === close) shut(); });
    document.addEventListener('keydown', key);
  }

  // 拖拽：只改 transform 变量，长按也能触发
  var drag = null;
  desk.addEventListener('pointerdown', function (e) {
    var card = e.target.closest('.card');
    if (!card || e.target.closest('.pin')) return;
    var d = byId[card.dataset.id];
    drag = { el:card, d:d, sx:e.clientX, sy:e.clientY, ox:d.x, oy:d.y, moved:false, id:e.pointerId };
    card.setPointerCapture(e.pointerId);
  });
  desk.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    if (!drag.moved) { drag.moved = true; drag.el.classList.add('dragging'); }
    drag.d.x = Math.max(0, Math.round(drag.ox + dx));
    drag.d.y = Math.max(0, Math.round(drag.oy + dy));
    position(drag.d);
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag.d, el = drag.el, moved = drag.moved;
    el.classList.remove('dragging');
    drag = null;
    if (moved) { save(); say('位置已记下'); }
    else openModal(d);
  }
  desk.addEventListener('pointerup', endDrag);
  desk.addEventListener('pointercancel', endDrag);

  desk.addEventListener('click', function (e) {
    var pin = e.target.closest('.pin');
    if (!pin) return;
    e.stopPropagation();
    var card = pin.closest('.card');
    var d = byId[card.dataset.id];
    d.pin = !d.pin;
    card.classList.toggle('pinned', d.pin);
    pin.textContent = d.pin ? '★' : '☆';
    save();
    say(d.pin ? '已钉在桌上' : '已取消钉住');
  });
  desk.addEventListener('keydown', function (e) {
    var card = e.target.closest('.card');
    if (!card) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(byId[card.dataset.id]); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      var d = byId[card.dataset.id];
      d.x = Math.max(0, d.x + (e.key === 'ArrowLeft' ? -12 : 12));
      position(d); save();
    }
  });

  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      current = tab.dataset.kind;
      document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t === tab)); });
      applyFilter();
    });
  });
  document.getElementById('search').addEventListener('input', function (e) { query = e.target.value; applyFilter(); });
  document.getElementById('tidyBtn').addEventListener('click', function () {
    var order = { book:0, movie:1, photo:2 };
    var cols = { book:4, movie:4, photo:4 };
    var count = { book:0, movie:0, photo:0 };
    var colW = { book:174, movie:174, photo:232 };
    var rowH = { book:246, movie:246, photo:180 };
    DATA.forEach(function (d) {
      if (d.kind === 'photo') { d.x = 40 + count.photo * colW.photo; d.y = 330 + Math.floor(count.photo / 1) * rowH.photo; count.photo++; }
      else { d.x = 40 + count[d.kind] * colW[d.kind]; d.y = 36 + Math.floor(count[d.kind] / 4) * rowH[d.kind]; count[d.kind]++; }
      d.rot = 0; position(d);
    });
    wrap.classList.add('grid-on');
    save(); say('桌面已整理');
    setTimeout(function () { wrap.classList.remove('grid-on'); }, 900);
  });
  document.getElementById('resetBtn').addEventListener('click', function () {
    try { localStorage.removeItem(STORE); } catch (e) {}
    var defaults = [
      [40,36,-2],[222,56,1.5],[404,38,-1],[618,44,2],[806,58,-1.5],[1000,40,1],
      [96,326,1.5],[348,342,-2],[598,330,2],[850,344,-1]
    ];
    DATA.forEach(function (d, i) { d.x = defaults[i][0]; d.y = defaults[i][1]; d.rot = defaults[i][2]; position(d); });
    say('已恢复默认布局');
  });
  document.getElementById('enterBtn').addEventListener('click', function () {
    document.getElementById('intro').classList.add('hidden');
    document.getElementById('studio').classList.remove('hidden');
    say('欢迎回来，桌面还在原处');
  });
  document.getElementById('backBtn').addEventListener('click', function () {
    document.getElementById('studio').classList.add('hidden');
    document.getElementById('intro').classList.remove('hidden');
  });

  load(); paint();
})();
</script>
