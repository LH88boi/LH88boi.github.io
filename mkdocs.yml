site_name: 地下头木
site_description: 地下头木的个人网站
site_author: 地下头木

theme:
  name: material
  language: zh
  custom_dir: overrides
  palette:
    scheme: default
  favicon: images/favicon.png
  features:
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - navigation.indexes

plugins:
  - blog:
      blog_dir: jottings
      post_dir: "{blog}/posts"
      post_date_format: yyyy-MM-dd HH:mm
      post_url_format: "{file}"
      pagination_per_page: 10
      pagination_keep_content: true
      post_readtime: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/home.js

nav:
  - 主页: index.md
  - 天网: jottings/index.md
  - 光影: light/index.md
  - 关于: about/index.md
